<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker - Sign Up</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <link rel="icon" href="/assets/pwa-icon-192.svg">
    <link rel="apple-touch-icon" href="/assets/pwa-icon-192.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .signup-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .signup-header p {
            color: #666;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 20px;
            flex: 1;
        }

        .form-group.full-width {
            flex: 1 1 100%;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input.error {
            border-color: #f44336;
        }

        .error-text {
            color: #f44336;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-text.show {
            display: block;
        }

        .password-strength {
            margin-top: 5px;
            font-size: 12px;
        }

        .strength-weak { color: #f44336; }
        .strength-medium { color: #ff9800; }
        .strength-strong { color: #4caf50; }

        .signup-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 14px;
        }

        .install-container {
            text-align: center;
            margin-top: 18px;
        }

        .install-btn {
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .install-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.25);
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        .success-message {
            background-color: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            pointer-events: none;
            opacity: 0.6;
        }

        .loading .signup-btn::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .terms {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            text-align: center;
        }

        .terms a {
            color: #667eea;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }
    </style>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js';
        import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyCxMoF0mTrZYej5K8h1_MkXQ3eKQ-4FZvE",
            authDomain: "moneytracker-c1dd1.firebaseapp.com",
            projectId: "moneytracker-c1dd1",
            storageBucket: "moneytracker-c1dd1.firebasestorage.app",
            messagingSenderId: "426881166394",
            appId: "1:426881166394:web:8f8ad1b09fc5b9267ede6e"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.doc = doc;
        window.setDoc = setDoc;
        window.serverTimestamp = serverTimestamp;
    </script>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <h1>Money Tracker</h1>
            <p>Create your account to get started</p>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="signupForm">
            <div class="form-group full-width">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                <div class="error-text" id="nameError">Please enter your full name</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="age">Age *</label>
                    <input type="number" id="age" name="age" min="13" max="120" placeholder="Age" required>
                    <div class="error-text" id="ageError">Age must be between 13-120</div>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender">
                        <option value="">Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                        <option value="prefer-not-to-say">Prefer not to say</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group full-width">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <div class="error-text" id="emailError">Please enter a valid email</div>
            </div>
            
            <div class="form-group full-width">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" placeholder="Create a password (min. 6 characters)" required>
                <div id="passwordStrength" class="password-strength"></div>
                <div class="error-text" id="passwordError">Password must be at least 6 characters</div>
            </div>
            
            <div class="form-group full-width">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                <div class="error-text" id="confirmPasswordError">Passwords do not match</div>
            </div>
            
            <button type="submit" class="signup-btn">Create Account</button>
            
            <p class="terms">
                By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </p>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="index.html">Login</a>
        </div>
        <div class="install-container">
            <button id="installBtn" class="install-btn" type="button" hidden>Install App</button>
        </div>
    </div>

    <script>
        // Firebase API Key
        const FIREBASE_API_KEY = 'AIzaSyCxMoF0mTrZYej5K8h1_MkXQ3eKQ-4FZvE';
        
        const form = document.getElementById('signupForm');
        const fullNameInput = document.getElementById('fullName');
        const ageInput = document.getElementById('age');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        
        // Password strength checker
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (password.length === 0) {
                strengthDiv.textContent = '';
                return;
            }
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z\d]/.test(password)) strength++;
            
            if (strength <= 2) {
                strengthDiv.textContent = 'Weak password';
                strengthDiv.className = 'password-strength strength-weak';
            } else if (strength <= 3) {
                strengthDiv.textContent = 'Medium password';
                strengthDiv.className = 'password-strength strength-medium';
            } else {
                strengthDiv.textContent = 'Strong password';
                strengthDiv.className = 'password-strength strength-strong';
            }
        });
        
        // Real-time validation
        fullNameInput.addEventListener('blur', function() {
            validateName();
        });
        
        ageInput.addEventListener('blur', function() {
            validateAge();
        });
        
        emailInput.addEventListener('blur', function() {
            validateEmail();
        });
        
        passwordInput.addEventListener('blur', function() {
            validatePassword();
        });
        
        confirmPasswordInput.addEventListener('blur', function() {
            validateConfirmPassword();
        });
        
        function validateName() {
            const name = fullNameInput.value.trim();
            const errorDiv = document.getElementById('nameError');
            
            if (name.length < 2) {
                fullNameInput.classList.add('error');
                errorDiv.classList.add('show');
                return false;
            }
            
            fullNameInput.classList.remove('error');
            errorDiv.classList.remove('show');
            return true;
        }
        
        function validateAge() {
            const age = parseInt(ageInput.value);
            const errorDiv = document.getElementById('ageError');
            
            if (isNaN(age) || age < 13 || age > 120) {
                ageInput.classList.add('error');
                errorDiv.classList.add('show');
                return false;
            }
            
            ageInput.classList.remove('error');
            errorDiv.classList.remove('show');
            return true;
        }
        
        function validateEmail() {
            const email = emailInput.value.trim();
            const errorDiv = document.getElementById('emailError');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!emailRegex.test(email)) {
                emailInput.classList.add('error');
                errorDiv.classList.add('show');
                return false;
            }
            
            emailInput.classList.remove('error');
            errorDiv.classList.remove('show');
            return true;
        }
        
        function validatePassword() {
            const password = passwordInput.value;
            const errorDiv = document.getElementById('passwordError');
            
            if (password.length < 6) {
                passwordInput.classList.add('error');
                errorDiv.classList.add('show');
                return false;
            }
            
            passwordInput.classList.remove('error');
            errorDiv.classList.remove('show');
            return true;
        }
        
        function validateConfirmPassword() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const errorDiv = document.getElementById('confirmPasswordError');
            
            if (password !== confirmPassword) {
                confirmPasswordInput.classList.add('error');
                errorDiv.classList.add('show');
                return false;
            }
            
            confirmPasswordInput.classList.remove('error');
            errorDiv.classList.remove('show');
            return true;
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
        }
        
        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideMessages();
            
            // Validate all fields
            const isNameValid = validateName();
            const isAgeValid = validateAge();
            const isEmailValid = validateEmail();
            const isPasswordValid = validatePassword();
            const isConfirmPasswordValid = validateConfirmPassword();
            
            if (!isNameValid || !isAgeValid || !isEmailValid || !isPasswordValid || !isConfirmPasswordValid) {
                showError('Please fix the errors in the form');
                return;
            }
            
            const fullName = fullNameInput.value.trim();
            const age = ageInput.value;
            const gender = document.getElementById('gender').value;
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            const signupContainer = document.querySelector('.signup-container');
            const signupBtn = document.querySelector('.signup-btn');
            const originalBtnText = signupBtn.textContent;
            
            // Show loading state
            signupContainer.classList.add('loading');
            signupBtn.textContent = 'Creating Account...';
            signupBtn.disabled = true;
            
            try {
                // Create Firebase user
                const userCredential = await createUserWithEmailAndPassword(firebaseAuth, email, password);
                const user = userCredential.user;
                
                // Save profile to Firestore
                await setDoc(doc(firebaseDb, 'users', user.uid), {
                    fullName: fullName,
                    age: parseInt(age),
                    gender: gender,
                    email: email,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });
                
                showSuccess('Account created successfully! Redirecting to login...');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } catch (error) {
                console.error('Signup error:', error);
                
                let errorMessage = error.message || 'Registration failed';
                
                // User-friendly error messages
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'This email is already registered. Please login instead.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password is too weak. Please use a stronger password (at least 6 characters).';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address format.';
                } else if (error.code === 'auth/operation-not-allowed') {
                    errorMessage = 'Email/password sign-in is disabled. Please contact support.';
                }
                
                showError(errorMessage);
            } finally {
                // Remove loading state
                signupContainer.classList.remove('loading');
                signupBtn.textContent = originalBtnText;
                signupBtn.disabled = false;
            }
        });
    </script>
    <script>
        let deferredInstallPrompt;
        const installBtn = document.getElementById("installBtn");

        window.addEventListener("beforeinstallprompt", (event) => {
            event.preventDefault();
            deferredInstallPrompt = event;
            installBtn.hidden = false;
        });

        installBtn.addEventListener("click", async () => {
            if (!deferredInstallPrompt) {
                return;
            }

            deferredInstallPrompt.prompt();
            await deferredInstallPrompt.userChoice;
            deferredInstallPrompt = null;
            installBtn.hidden = true;
        });

        window.addEventListener("appinstalled", () => {
            deferredInstallPrompt = null;
            installBtn.hidden = true;
        });
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js").catch((error) => {
                    console.warn("Service worker registration failed:", error);
                });
            });
        }
    </script>
</body>
</html>
